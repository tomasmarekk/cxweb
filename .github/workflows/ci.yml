name: Rust checks
on: [push, pull_request]
jobs:
  portable:
    name: Portable Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-contracts
      - run: cargo test --locked --workspace --exclude cxweb-desktop
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-checks
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p cxweb-platform
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify desktop and browser behavior
        shell: pwsh
        run: |
          $tests = Get-ChildItem apps/desktop/tests, crates/browser-adapter/tests, scripts -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript tests failed.' }
