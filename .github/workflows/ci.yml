name: Rust checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/desktop/tests/app.test.mjs
      - run: node --test apps/desktop/tests/installed.test.mjs
      - run: node --test crates/browser-adapter/tests/model_surface.test.mjs
      - run: node --test crates/browser-adapter/tests/composer.test.mjs
      - run: node --test crates/browser-adapter/tests/answer_content.test.mjs
      - run: node --test crates/browser-adapter/tests/account_scope.test.mjs
      - run: node --test crates/browser-adapter/tests/temporary_chat.test.mjs
      - run: node --test scripts/probe-client-approval.test.mjs
