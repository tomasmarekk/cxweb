name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional new tag, for example v0.2.0. Leave empty for the next available version.'
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark this release as a preview
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/prepare-release.test.mjs
      - name: Select and stage an unused release version
        id: prepare
        run: node scripts/prepare-release.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Verify desktop and browser behavior
        shell: pwsh
        run: |
          $tests = Get-ChildItem apps/desktop/tests, crates/browser-adapter/tests, scripts -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript tests failed.' }
      - name: Install pinned packaging tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Path $toolDirectory | Out-Null
          gh release download tauri-cli-v2.11.2 --repo tauri-apps/tauri --pattern cargo-tauri-x86_64-pc-windows-msvc.zip --dir $toolDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tool download failed.' }
          $archive = Join-Path $toolDirectory 'cargo-tauri-x86_64-pc-windows-msvc.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b6844470bcbf1da6e5dbf01990ae317d4d7969171628bb8badbdbff2e3d06d23') {
            throw 'Packaging tool checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          $binary = Get-ChildItem -LiteralPath $toolDirectory -Filter cargo-tauri.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Packaging tool is missing.' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify installer hooks
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Stage this release's assets
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ steps.prepare.outputs.installer }}
        run: |
          New-Item -ItemType Directory -Path .local/release-assets -Force | Out-Null
          Copy-Item -LiteralPath "target/release/bundle/nsis/$env:INSTALLER_NAME" -Destination .local/release-assets
          Copy-Item -LiteralPath "target/release/bundle/nsis/$env:INSTALLER_NAME.sha256" -Destination .local/release-assets
          Copy-Item -LiteralPath .local/release-provenance.json -Destination .local/release-assets
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cxweb-windows-${{ steps.prepare.outputs.tag }}
          path: .local/release-assets/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cxweb-windows-${{ needs.build.outputs.tag }}
          path: release-assets
      - name: Publish release without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Bump the source version and use a new tag.' >&2
            exit 1
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -n "$existing_tag" ]; then
            echo 'The tag already exists. Use a new version so release provenance is unambiguous.' >&2
            exit 1
          fi
          args=(--target "$SOURCE_SHA" --title "cxweb $RELEASE_TAG" --notes-file packaging/windows/RELEASE-NOTES.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          version="${RELEASE_TAG#v}"
          installer="release-assets/cxweb_${version}_x64-setup.exe"
          provenance="release-assets/release-provenance.json"
          test -f "$installer" && test -f "$installer.sha256" && test -f "$provenance"
          (cd "$(dirname "$installer")" && sha256sum --check "$(basename "$installer").sha256")
          gh release create "$RELEASE_TAG" "${args[@]}" "$installer" "$installer.sha256" "$provenance"
