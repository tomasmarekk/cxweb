<!doctype html><html><head><meta charset="utf-8"><title>cxweb synthetic fixture</title>
<style>@keyframes fixture-progress { from { opacity: 0; } to { opacity: 1; } } #fixture-animation { animation: fixture-progress 100ms linear forwards; }</style>
</head><body><div id="fixture-animation">Animation fixture</div>
<form><button type="button" data-testid="model-switcher-dropdown-button" aria-haspopup="menu" style="width:340px">Fixture text mode</button>
<button type="button" data-testid="accounts-profile-button" aria-controls="account-menu" aria-expanded="false">Fixture account</button>
<div id="account-menu" role="menu" hidden><button type="button" role="menuitem" id="fixture-settings">Settings</button><div role="menuitemradio" aria-checked="true" data-workspace-id="fixture-workspace">Fixture workspace</div></div>
<div role="dialog" id="fixture-account-settings" hidden>
  <button type="button" role="tab" aria-selected="true" aria-controls="fixture-general">General</button>
  <button type="button" role="tab" aria-selected="false" aria-controls="fixture-account">Account</button>
  <div role="tabpanel" id="fixture-general">General preferences</div>
  <div role="tabpanel" id="fixture-account" hidden>Loading</div>
</div>
<button data-testid="temporary-chat-button">Temporary chat</button>
<div id="model-menu" role="group" data-testid="composer-intelligence-picker-content" hidden>
  <button role="menuitemradio" data-testid="model-fixture-text" aria-checked="true">Fixture text mode</button>
  <button role="menuitemradio" data-testid="model-fixture-reasoning" aria-checked="false">Fixture reasoning mode</button>
  <div data-testid="composer-model-picker-slider-simple-view"><span id="fixture-effort-label">Standard, 1 of 2.</span><div data-model-reasoning-effort-slider><input role="slider" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"></div></div>
</div>
<div data-turn-id-container="old-assistant"><section data-testid="conversation-turn-old" data-turn-id="old-assistant" data-turn="assistant"><div data-message-author-role="assistant"><div class="markdown">historical message must not be returned</div></div><button data-testid="copy-turn-action-button">Copy</button></section></div>
<div id="prompt-textarea" contenteditable="true"></div><button type="button" data-testid="send-button">Send</button></form>
<script>
document.querySelector('#fixture-settings').onclick = () => {
  document.querySelector('#account-menu').hidden = true;
  document.querySelector('[data-testid="accounts-profile-button"]').setAttribute('aria-expanded', 'false');
  document.querySelector('#fixture-account-settings').hidden = false;
};
document.querySelector('[aria-controls="fixture-account"]').onclick = event => {
  document.querySelector('[aria-controls="fixture-general"]').setAttribute('aria-selected', 'false');
  event.currentTarget.setAttribute('aria-selected', 'true');
  document.querySelector('#fixture-general').hidden = true;
  document.querySelector('#fixture-account').hidden = false;
  setTimeout(() => { document.querySelector('#fixture-account').textContent = 'Email: fixture@example.invalid'; }, 80);
};
document.querySelector('[data-testid="accounts-profile-button"]').onclick = event => {
  const menu = document.querySelector('#account-menu');
  menu.hidden = !menu.hidden;
  event.currentTarget.setAttribute('aria-expanded', String(!menu.hidden));
};
document.querySelector('[data-testid="accounts-profile-button"]').onkeydown = event => {
  if (event.key === 'Enter') { event.preventDefault(); event.currentTarget.click(); }
};
document.querySelector('[data-testid="model-switcher-dropdown-button"]').onclick = () => {
  const menu = document.querySelector('#model-menu'); setTimeout(() => { menu.hidden = !menu.hidden; }, 40);
};
document.querySelector('[data-testid="model-switcher-dropdown-button"]').onmouseenter = event => {
  event.currentTarget.style.width = '100px';
};
document.querySelector('[data-testid="model-switcher-dropdown-button"]').onkeydown = event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    document.querySelector('[data-testid="model-switcher-dropdown-button"]').click();
  }
};
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !document.querySelector('#model-menu').hidden) {
    setTimeout(() => { document.querySelector('#model-menu').hidden = true; }, 80);
  }
  if (event.key === 'Escape') {
    document.querySelector('#fixture-account-settings').hidden = true;
    document.querySelector('#account-menu').hidden = true;
    document.querySelector('[data-testid="accounts-profile-button"]').setAttribute('aria-expanded', 'false');
  }
  if (event.target?.getAttribute('role') === 'slider' && ['ArrowLeft', 'ArrowRight'].includes(event.key)) {
    const slider = event.target;
    const current = Number(slider.getAttribute('aria-valuenow'));
    const next = Math.max(0, Math.min(1, current + (event.key === 'ArrowRight' ? 1 : -1)));
    setTimeout(() => {
      slider.setAttribute('aria-valuenow', String(next));
      // Delayed accessible text must not be paired with the new numeric value.
      setTimeout(() => {
        document.querySelector('#fixture-effort-label').textContent = next === 1 && document.body.dataset.fixtureEffortFailure === 'true'
          ? 'Unqualified label' : `${next === 0 ? 'Standard' : 'Extended'}, ${next + 1} of 2.`;
      }, 40);
    }, 40);
  }
});
document.querySelector('[data-testid="send-button"]').onclick = () => {
  const composer = document.querySelector('#prompt-textarea');
  const userContainer = document.createElement('div'); userContainer.dataset.turnIdContainer = 'new-user';
  const user = document.createElement('section'); user.dataset.testid = 'conversation-turn-user'; user.dataset.turnId = 'new-user'; user.dataset.turn = 'user';
  const userContent = document.createElement('div'); userContent.dataset.messageAuthorRole = 'user';
  const message = document.createElement('div'); message.style.whiteSpace = 'pre-wrap'; message.style.maxHeight = '24px'; message.style.overflow = 'hidden'; message.textContent = composer.innerText;
  const expand = document.createElement('button'); expand.type = 'button'; expand.textContent = 'Show more';
  userContent.append(message, expand); user.append(userContent); userContainer.append(user); document.body.append(userContainer);
  const assistantContainer = document.createElement('div'); assistantContainer.dataset.turnIdContainer = 'new-assistant';
  const turn = document.createElement('section'); turn.dataset.testid = 'conversation-turn-new'; turn.dataset.turnId = 'new-assistant'; turn.dataset.turn = 'assistant';
  const assistant = document.createElement('div'); assistant.dataset.messageAuthorRole = 'assistant';
  const text = document.createElement('div'); text.className = 'markdown'; text.textContent = 'fixture response'; assistant.append(text);
  const complete = document.createElement('button'); complete.dataset.testid = 'copy-turn-action-button'; complete.textContent = 'Copy';
  turn.append(assistant, complete); assistantContainer.append(turn); document.body.append(assistantContainer); composer.replaceChildren();
};
</script></body></html>
