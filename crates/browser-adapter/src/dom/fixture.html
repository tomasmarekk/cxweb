<!doctype html><html><head><meta charset="utf-8"><title>cxweb synthetic fixture</title></head><body>
<button data-testid="model-switcher-dropdown-button">Fixture text mode</button>
<section data-testid="conversation-turn-old"><div data-message-id="old-assistant" data-message-author-role="assistant"><div class="markdown">historical message must not be returned</div></div><button data-testid="copy-turn-action-button">Copy</button></section>
<div id="prompt-textarea" contenteditable="true"></div><button data-testid="send-button">Send</button>
<script>
document.querySelector('[data-testid="send-button"]').onclick = () => {
  const composer = document.querySelector('#prompt-textarea');
  const user = document.createElement('div');
  user.setAttribute('data-message-id', 'new-user'); user.setAttribute('data-message-author-role', 'user');
  user.innerText = composer.innerText;
  document.body.append(user);
  const turn = document.createElement('section'); turn.dataset.testid = 'conversation-turn-new';
  const assistant = document.createElement('div'); assistant.dataset.messageId = 'new-assistant'; assistant.dataset.messageAuthorRole = 'assistant';
  const text = document.createElement('div'); text.className = 'markdown'; text.textContent = 'fixture response'; assistant.append(text);
  const complete = document.createElement('button'); complete.dataset.testid = 'copy-turn-action-button'; complete.textContent = 'Copy';
  turn.append(assistant, complete); document.body.append(turn); composer.replaceChildren();
};
</script></body></html>
