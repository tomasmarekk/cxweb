[workspace]
members = ["crates/domain", "crates/codex-adapter", "crates/platform", "crates/browser-adapter", "crates/runtime", "apps/cli", "apps/daemon", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
cxweb-domain = { path = "crates/domain" }
cxweb-codex-adapter = { path = "crates/codex-adapter" }
cxweb-runtime = { path = "crates/runtime" }
cxweb-platform = { path = "crates/platform" }
cxweb-browser-adapter = { path = "crates/browser-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
toml_edit = "0.23"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
strip = true
